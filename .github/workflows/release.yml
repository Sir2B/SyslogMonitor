name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Check out release tooling
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Check release version
        id: version
        shell: pwsh
        env:
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          $source = Get-Content ".\src\syslog_monitor\__init__.py" -Raw
          $version = [regex]::Match($source, '__version__\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $version) {
            throw "Could not read the application version."
          }
          $projectVersion = & $env:PYTHON_EXECUTABLE -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the project version."
          }
          if ($projectVersion -cne $version -or $env:TAG -cne "v$version") {
            throw "Tag $env:TAG, application version $version and project version $projectVersion do not match."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build and test distribution
        shell: pwsh
        env:
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
          QT_QPA_PLATFORM: offscreen
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP "SyslogMonitor-build-3.15"
          & $env:PYTHON_EXECUTABLE -m venv (Join-Path $workRoot "venv")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create the build environment."
          }
          & ".\packaging\build.ps1" -PythonVersion "3.15" -WorkRoot $workRoot
      # Native Qt platform plugin on purpose: "offscreen" has no fonts on Windows.
      - name: Render screenshot
        shell: pwsh
        run: |
          $screenshotScript = ".\packaging\make_screenshot.py"
          if (-not (Test-Path -LiteralPath $screenshotScript -PathType Leaf)) {
            $fallback = ".\.release-tooling\packaging\make_screenshot.py"
            if (-not (Test-Path -LiteralPath $fallback -PathType Leaf)) {
              throw "No screenshot script is available for $env:TAG."
            }
            Copy-Item -LiteralPath $fallback -Destination $screenshotScript
          }
          $python = Join-Path $env:RUNNER_TEMP "SyslogMonitor-build-3.15\venv\Scripts\python.exe"
          & $python $screenshotScript --output (Join-Path $env:RUNNER_TEMP "screenshot.png")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not render the screenshot."
          }
      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $publisher = ".\.release-tooling\packaging\publish_release.ps1"
          } else {
            $publisher = ".\packaging\publish_release.ps1"
          }
          & $publisher -Tag $env:TAG -Version $env:VERSION -DistributionDir ".\dist" `
            -Screenshot (Join-Path $env:RUNNER_TEMP "screenshot.png")
